name: geo_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.14
  - gdal>=3.10
  - rasterio>=1.4
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - pysheds>=0.5
  - scikit-learn>=1.5
  - scikit-image>=0.24
  - joblib>=1.3
  - numpy>=1.26
  - pandas>=2.2
  - matplotlib>=3.9
  - pillow>=10.0
  - pyogrio>=0.10
  - pip
  - pip:
      - fastapi>=0.110.0
      - uvicorn>=0.28.0
      - pydantic>=2.6
      - rasterstats>=0.19.0
